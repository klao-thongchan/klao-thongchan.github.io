  <text x="575" y="136" fill="#b1c4ba" font-family="Inter, -apple-system, sans-serif" font-size="11">Verification Pass Rate</text>
  <text x="575" y="172" fill="#a5dc9d" font-family="Inter, -apple-system, sans-serif" font-size="30" font-weight="700">96.4%</text>
  <text x="675" y="170" fill="#7fd1ae" font-family="ui-monospace, monospace" font-size="10">n=1,250 runs</text>
  <text x="575" y="189" fill="#8fa89e" font-family="Inter, -apple-system, sans-serif" font-size="10">Zero unflagged hallucinations</text>

  <!-- Metric bars -->
