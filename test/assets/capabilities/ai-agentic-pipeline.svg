  <rect x="561" y="265" width="203" height="7" rx="3.5" fill="#0f1f1c"/>
  <rect x="561" y="265" width="192" height="7" rx="3.5" fill="url(#accentGrad)"/>

  <text x="561" y="294" fill="#eef3e9" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600">Schema &amp; Policy Safety</text>
  <text x="764" y="294" text-anchor="end" fill="#a5dc9d" font-family="ui-monospace, monospace" font-size="11">1.00</text>
  <rect x="561" y="301" width="203" height="7" rx="3.5" fill="#0f1f1c"/>
  <rect x="561" y="301" width="203" height="7" rx="3.5" fill="url(#accentGrad)"/>

  <text x="561" y="330" fill="#eef3e9" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600">Latency Budget (&lt;2.5s)</text>
  <text x="764" y="330" text-anchor="end" fill="#a5dc9d" font-family="ui-monospace, monospace" font-size="11">1.42s</text>
  <rect x="561" y="337" width="203" height="7" rx="3.5" fill="#0f1f1c"/>
  <rect x="561" y="337" width="175" height="7" rx="3.5" fill="url(#accentGrad)"/>

  <!-- Human review badge -->
  <rect x="561" y="362" width="203" height="62" rx="6" fill="#19332e" stroke="#528978"/>
  <text x="575" y="383" fill="#a5dc9d" font-family="ui-monospace, monospace" font-size="10" font-weight="700">AUDIT TRAIL READY</text>
  <text x="575" y="400" fill="#eef3e9" font-family="Inter, -apple-system, sans-serif" font-size="11">Every step logs prompt, cited</text>
  <text x="575" y="414" fill="#eef3e9" font-family="Inter, -apple-system, sans-serif" font-size="11">chunks &amp; reviewer decision.</text>
</svg>
