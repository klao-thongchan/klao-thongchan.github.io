  <circle cx="307" cy="308" r="10" fill="#a5dc9d"/>
  <text x="307" y="312" text-anchor="middle" fill="#111e1c" font-family="ui-monospace, monospace" font-size="10" font-weight="700">3</text>
  <text x="327" y="300" fill="#eef3e9" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600">Deterministic Eval Gate</text>
  <text x="327" y="317" fill="#b1c4ba" font-family="ui-monospace, monospace" font-size="10">Glossary + PII + Tone check</text>
  <text x="327" y="331" fill="#a5dc9d" font-family="ui-monospace, monospace" font-size="10">status: PASS (4/4 assertions)</text>

  <line x1="400" y1="340" x2="400" y2="360" stroke="#7fd1ae" stroke-width="2"/>

  <rect x="287" y="360" width="226" height="64" rx="6" fill="#0f1f1c" stroke="#3b6358"/>
  <text x="303" y="382" fill="#eef3e9" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600">Failure Mode Routing</text>
  <text x="303" y="400" fill="#8fa89e" font-family="Inter, -apple-system, sans-serif" font-size="10">Confidence &lt; 0.85 routes to</text>
  <text x="303" y="414" fill="#a5dc9d" font-family="ui-monospace, monospace" font-size="10">→ human_reviewer_queue</text>

  <!-- Right Panel: Evaluation & Trust Scorecard -->
