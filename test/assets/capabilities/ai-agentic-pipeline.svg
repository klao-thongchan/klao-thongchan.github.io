  <!-- Left Panel: Input & RAG Context -->
  <rect x="20" y="72" width="235" height="368" rx="8" fill="#152a26" stroke="#2e4c44"/>
  <text x="36" y="98" fill="#a5dc9d" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">01 / INPUT &amp; RAG CONTEXT</text>

  <rect x="36" y="112" width="203" height="68" rx="6" fill="#0f1f1c" stroke="#29443d"/>
  <text x="48" y="132" fill="#eef3e9" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600">Incoming Task Payload</text>
  <text x="48" y="150" fill="#8fa89e" font-family="ui-monospace, monospace" font-size="10">source: support_localization</text>
