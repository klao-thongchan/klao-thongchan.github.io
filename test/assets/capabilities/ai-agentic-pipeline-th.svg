<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" aria-labelledby="ai-img-title ai-img-desc">
  <title id="ai-img-title">ระบบ Applied AI และ Agentic Workflow ที่ตรวจสอบผลลัพธ์ได้</title>
  <desc id="ai-img-desc">หน้าต่างแสดงผลการทำงานของ RAG Context, การทำงานของ Agent แบบหลายขั้นตอน, การตรวจสอบคุณภาพ Localization และคะแนน Verification แบบ Human-in-the-loop</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#132623"/>
      <stop offset="100%" stop-color="#1b3932"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7fd1ae"/>
      <stop offset="100%" stop-color="#a5dc9d"/>
    </linearGradient>
  </defs>

  <!-- Canvas background -->
  <rect width="800" height="460" rx="12" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="798" height="458" rx="11" fill="none" stroke="#36584f" stroke-width="2"/>

  <!-- Top window bar -->
  <rect x="20" y="18" width="760" height="38" rx="6" fill="#0f1f1c" stroke="#2b4740"/>
  <circle cx="40" cy="37" r="5" fill="#e06c75"/>
  <circle cx="56" cy="37" r="5" fill="#e5c07b"/>
  <circle cx="72" cy="37" r="5" fill="#7fd1ae"/>
  <text x="96" y="41" fill="#b1c4ba" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">AGENTIC WORKFLOW ENGINE · RAG + EVAL HARNESS v2.4</text>
  <rect x="642" y="26" width="124" height="22" rx="4" fill="#173e35" stroke="#7fd1ae" stroke-width="1"/>
  <text x="704" y="41" text-anchor="middle" fill="#a5dc9d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700">GUARDRAILS: เปิดใช้งาน</text>

  <!-- Left Panel: Input & RAG Context -->
  <rect x="20" y="72" width="235" height="368" rx="8" fill="#152a26" stroke="#2e4c44"/>
  <text x="36" y="98" fill="#a5dc9d" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="0.8">01 / ข้อมูลนำเข้า &amp; RAG CONTEXT</text>

  <rect x="36" y="112" width="203" height="68" rx="6" fill="#0f1f1c" stroke="#29443d"/>
  <text x="48" y="132" fill="#eef3e9" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600">Task Payload ที่รับเข้ามา</text>
  <text x="48" y="150" fill="#8fa89e" font-family="ui-monospace, monospace" font-size="10">source: support_localization</text>
  <text x="48" y="166" fill="#8fa89e" font-family="ui-monospace, monospace" font-size="10">locale: zh-CN → th-TH</text>

  <text x="36" y="204" fill="#b1c4ba" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600">ข้อมูลอ้างอิงที่ดึงจาก RAG</text>

  <rect x="36" y="216" width="203" height="58" rx="5" fill="#19332e" stroke="#3b6358"/>
  <text x="48" y="235" fill="#eef3e9" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600">Term Base · Ash Echoes TH</text>
  <text x="48" y="252" fill="#a5dc9d" font-family="ui-monospace, monospace" font-size="10">cosine_sim: 0.94 · ยืนยันแล้ว</text>
  <text x="48" y="266" fill="#8fa89e" font-family="Inter, -apple-system, sans-serif" font-size="10">คลังคำศัพท์เฉพาะ &amp; ระดับภาษา</text>

  <rect x="36" y="284" width="203" height="58" rx="5" fill="#19332e" stroke="#3b6358"/>
  <text x="48" y="303" fill="#eef3e9" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600">Payment FAQ Policy v3.1</text>
  <text x="48" y="320" fill="#a5dc9d" font-family="ui-monospace, monospace" font-size="10">cosine_sim: 0.89 · ยืนยันแล้ว</text>
  <text x="48" y="334" fill="#8fa89e" font-family="Inter, -apple-system, sans-serif" font-size="10">เงื่อนไข 3P Payment &amp; Refund SLA</text>

  <rect x="36" y="356" width="203" height="68" rx="6" fill="#0f1f1c" stroke="#29443d"/>
  <text x="48" y="376" fill="#b1c4ba" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="600">สัดส่วน CONTEXT WINDOW</text>
  <rect x="48" y="388" width="179" height="8" rx="4" fill="#233b35"/>
  <rect x="48" y="388" width="118" height="8" rx="4" fill="url(#accentGrad)"/>
  <text x="48" y="413" fill="#8fa89e" font-family="ui-monospace, monospace" font-size="10">2,840 / 4,096 tokens (69%)</text>

