  <rect x="271" y="72" width="258" height="368" rx="8" fill="#152a26" stroke="#2e4c44"/>
  <text x="287" y="98" fill="#a5dc9d" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="0.8">02 / AGENT ORCHESTRATION</text>

  <!-- Step nodes -->
  <rect x="287" y="114" width="226" height="58" rx="6" fill="#1c3832" stroke="#528978"/>
  <circle cx="307" cy="143" r="10" fill="#116b58" stroke="#a5dc9d" stroke-width="1.5"/>
  <text x="307" y="147" text-anchor="middle" fill="#eef3e9" font-family="ui-monospace, monospace" font-size="10" font-weight="700">1</text>
  <text x="327" y="137" fill="#eef3e9" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600">คัดกรอง Intent &amp; Schema</text>
  <text x="327" y="155" fill="#b1c4ba" font-family="ui-monospace, monospace" font-size="10">n8n webhook + JSON schema</text>

  <line x1="400" y1="172" x2="400" y2="192" stroke="#7fd1ae" stroke-width="2" stroke-dasharray="3 3"/>

  <rect x="287" y="192" width="226" height="64" rx="6" fill="#1c3832" stroke="#528978"/>
  <circle cx="307" cy="224" r="10" fill="#116b58" stroke="#a5dc9d" stroke-width="1.5"/>
  <text x="307" y="228" text-anchor="middle" fill="#eef3e9" font-family="ui-monospace, monospace" font-size="10" font-weight="700">2</text>
  <text x="327" y="216" fill="#eef3e9" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600">ประมวลผลแบบอ้างอิงข้อมูล</text>
  <text x="327" y="233" fill="#b1c4ba" font-family="ui-monospace, monospace" font-size="10">OpenAI API · temp=0.15</text>
  <text x="327" y="247" fill="#a5dc9d" font-family="ui-monospace, monospace" font-size="10">citations: [TB-104, FAQ-12]</text>

  <line x1="400" y1="256" x2="400" y2="276" stroke="#7fd1ae" stroke-width="2" stroke-dasharray="3 3"/>

  <rect x="287" y="276" width="226" height="64" rx="6" fill="#1c3832" stroke="#7fd1ae" stroke-width="1.5"/>
  <circle cx="307" cy="308" r="10" fill="#a5dc9d"/>
  <text x="307" y="312" text-anchor="middle" fill="#111e1c" font-family="ui-monospace, monospace" font-size="10" font-weight="700">3</text>
  <text x="327" y="300" fill="#eef3e9" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600">ด่านตรวจ Eval เชิงตรรกะ</text>
  <text x="327" y="317" fill="#b1c4ba" font-family="ui-monospace, monospace" font-size="10">ตรวจ Glossary + PII + Tone</text>
  <text x="327" y="331" fill="#a5dc9d" font-family="ui-monospace, monospace" font-size="10">status: PASS (4/4 เงื่อนไข)</text>

  <line x1="400" y1="340" x2="400" y2="360" stroke="#7fd1ae" stroke-width="2"/>

  <rect x="287" y="360" width="226" height="64" rx="6" fill="#0f1f1c" stroke="#3b6358"/>
  <text x="303" y="382" fill="#eef3e9" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600">จัดการกรณีความมั่นใจต่ำ</text>
  <text x="303" y="400" fill="#8fa89e" font-family="Inter, -apple-system, sans-serif" font-size="10">เมื่อ Confidence &lt; 0.85 ส่งต่อไปยัง</text>
  <text x="303" y="414" fill="#a5dc9d" font-family="ui-monospace, monospace" font-size="10">→ human_reviewer_queue</text>

  <!-- Right Panel: Evaluation & Trust Scorecard -->
  <rect x="545" y="72" width="235" height="368" rx="8" fill="#152a26" stroke="#2e4c44"/>
  <text x="561" y="98" fill="#a5dc9d" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="0.8">03 / EVALUATION SCORECARD</text>

  <!-- Big metric -->
  <rect x="561" y="114" width="203" height="84" rx="6" fill="#0f1f1c" stroke="#29443d"/>
  <text x="575" y="136" fill="#b1c4ba" font-family="Inter, -apple-system, sans-serif" font-size="11">อัตราการผ่านเกณฑ์ตรวจสอบ</text>
  <text x="575" y="172" fill="#a5dc9d" font-family="Inter, -apple-system, sans-serif" font-size="30" font-weight="700">96.4%</text>
  <text x="675" y="170" fill="#7fd1ae" font-family="ui-monospace, monospace" font-size="10">n=1,250 รอบ</text>
  <text x="575" y="189" fill="#8fa89e" font-family="Inter, -apple-system, sans-serif" font-size="10">คัดกรอง Hallucination ได้ครบถ้วน</text>

  <!-- Metric bars -->
  <text x="561" y="222" fill="#eef3e9" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600">ความถูกต้องตามแหล่งอ้างอิง</text>
  <text x="764" y="222" text-anchor="end" fill="#a5dc9d" font-family="ui-monospace, monospace" font-size="11">0.98</text>
  <rect x="561" y="229" width="203" height="7" rx="3.5" fill="#0f1f1c"/>
  <rect x="561" y="229" width="198" height="7" rx="3.5" fill="url(#accentGrad)"/>

  <text x="561" y="258" fill="#eef3e9" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600">ความเหมาะสมของสำนวนไทย</text>
  <text x="764" y="258" text-anchor="end" fill="#a5dc9d" font-family="ui-monospace, monospace" font-size="11">0.95</text>
  <rect x="561" y="265" width="203" height="7" rx="3.5" fill="#0f1f1c"/>
  <rect x="561" y="265" width="192" height="7" rx="3.5" fill="url(#accentGrad)"/>

  <text x="561" y="294" fill="#eef3e9" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600">ความปลอดภัยของ Schema &amp; Policy</text>
  <text x="764" y="294" text-anchor="end" fill="#a5dc9d" font-family="ui-monospace, monospace" font-size="11">1.00</text>
  <rect x="561" y="301" width="203" height="7" rx="3.5" fill="#0f1f1c"/>
  <rect x="561" y="301" width="203" height="7" rx="3.5" fill="url(#accentGrad)"/>

  <text x="561" y="330" fill="#eef3e9" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600">ความเร็วประมวลผล (&lt;2.5s)</text>
  <text x="764" y="330" text-anchor="end" fill="#a5dc9d" font-family="ui-monospace, monospace" font-size="11">1.42s</text>
  <rect x="561" y="337" width="203" height="7" rx="3.5" fill="#0f1f1c"/>
  <rect x="561" y="337" width="175" height="7" rx="3.5" fill="url(#accentGrad)"/>

  <!-- Human review badge -->
  <rect x="561" y="362" width="203" height="62" rx="6" fill="#19332e" stroke="#528978"/>
  <text x="575" y="383" fill="#a5dc9d" font-family="ui-monospace, monospace" font-size="10" font-weight="700">พร้อมตรวจสอบย้อนหลัง (AUDIT)</text>
  <text x="575" y="400" fill="#eef3e9" font-family="Inter, -apple-system, sans-serif" font-size="11">บันทึก Prompt, ข้อมูลอ้างอิง และ</text>
  <text x="575" y="414" fill="#eef3e9" font-family="Inter, -apple-system, sans-serif" font-size="11">ผลการอนุมัติครบทุกขั้นตอน</text>
</svg>
