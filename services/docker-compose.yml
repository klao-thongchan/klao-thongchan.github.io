# Production Orchestration (Zero-Trust LTS Microservice)
services:
  lts-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: klao-prod-lts-core
    environment:
      - PORT=8080
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set (min 32 chars)}
      - AUTH_API_KEY=${AUTH_API_KEY:?AUTH_API_KEY must be set}
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
