<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100%" height="100%">
  <defs>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="bookGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  <style>
    .book-cover { fill: url(#bookGrad); }
    .book-spine { fill: rgba(0,0,0,0.15); }
    .book-page { fill: #f1f5f9; }
    @media (prefers-color-scheme: dark) {
      .book-cover { fill: url(#bookGradDark); }
      .book-spine { fill: rgba(255,255,255,0.2); }
      .book-page { fill: #334155; }
    }
  </style>
  
  <!-- Book 3 (Bottom) -->
  <rect class="book-cover" x="3" y="16" width="18" height="5" rx="1.5" />
  <rect class="book-page" x="6" y="17" width="14" height="3" />
  <rect class="book-spine" x="3" y="16" width="3" height="5" rx="0.5" />

  <!-- Book 2 (Middle) -->
  <rect class="book-cover" x="4" y="10" width="17" height="5" rx="1.5" />
  <rect class="book-page" x="7" y="11" width="13" height="3" />
  <rect class="book-spine" x="4" y="10" width="3" height="5" rx="0.5" />

  <!-- Book 1 (Top) -->
  <rect class="book-cover" x="2" y="4" width="19" height="5" rx="1.5" />
  <rect class="book-page" x="5" y="5" width="15" height="3" />
  <rect class="book-spine" x="2" y="4" width="3" height="5" rx="0.5" />
</svg>
