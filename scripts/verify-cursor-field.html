<!doctype html><html style="scroll-behavior:auto"><head><meta charset="utf-8"><title>Cursor field rendering checks</title><link rel="stylesheet" href="../test/css/portfolio.css"></head><body><section class="hero container"><div class="cursor-field" aria-hidden="true"></div><h1>Background checks</h1></section><pre id="results">Checking…</pre><div style="height:3000px"></div><script type="module">
import { initCursorField } from '../test/js/cursor-field.js';
const results = [], times = [];
const native = WebGL2RenderingContext.prototype.drawElements;
WebGL2RenderingContext.prototype.drawElements = function (...args) { times.push(performance.now()); return native.apply(this,args); };
const delay = ms => new Promise(r=>setTimeout(r,ms));
const check = (name,pass) => results.push({name,pass});
initCursorField();
await delay(1800);
check('Canvas created', !!document.querySelector('canvas'));
const idle = times.length;
await delay(200);
check('No idle renders',times.length === idle);
window.dispatchEvent(new PointerEvent('pointermove',{clientX:900,clientY:200,pointerType:'mouse'}));
await delay(1700);
check('Cursor triggers animation',times.length > idle + 5);
check('At most 30 fps',times.every(time => times.filter(t => t >= time && t < time + 1000).length <= 31));
const settled = times.length;
await delay(250);
check('Stops after settling',times.length === settled);
scrollTo(0,1400);
await delay(150);
const offscreen = times.length;
window.dispatchEvent(new PointerEvent('pointermove',{clientX:200,clientY:300,pointerType:'mouse'}));
await delay(200);
check('No offscreen renders',times.length === offscreen);
scrollTo(0,0);
await delay(100);
const canvas = document.querySelector('canvas');
check('Pixel budget',canvas.width*canvas.height<=720000);
window.dispatchEvent(new PageTransitionEvent('pagehide'));
check('Canvas disposed on page exit',!document.querySelector('canvas'));
document.querySelector('#results').textContent=JSON.stringify(results,null,2);
</script></body></html>
