# Production Edge Ingress & Anti-PHP Probing Façade (NGINX)
# Prevents PHP2Shell, CGI Argument Injection, and automated scanner reconnaissance

server {
    listen 80;
    listen [::]:80;
    server_name klao-thongchan.github.io;

    # Enforce HTTPS redirect at the edge
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name klao-thongchan.github.io;

    root /var/www/html;
    index index.html;

    # 1. Zero-Trust Security Response Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://www.googletagmanager.com; style-src 'self' https://fonts.googleapis.com https://cdnjs.cloudflare.com; img-src 'self' data: https://www.google-analytics.com https://www.googletagmanager.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self' https://*.google-analytics.com https://www.google-analytics.com; form-action 'none'; frame-src 'none'; upgrade-insecure-requests;" always;

    # 2. Block CGI Argument Injection (CVE-2024-4577, CVE-2026-109618 PHP2Shell)
    if ($query_string ~* "(-d\+allow_url_include|-d\+auto_prepend_file|allow_url_include|auto_prepend_file|php:\/\/input|php:\/\/filter)") {
        return 403;
    }

    # 3. Intercept & Terminate Legacy PHP / Script Probing at the Edge
    location ~* \.(php|phtml|phar|php3|php4|php5|php7|php8|cgi|pl|asp|aspx|jsp)$ {
        access_log off;
        log_not_found off;
        return 404;
    }

    # 4. Intercept Common Automated Vulnerability Scanners & CMS Probing
    location ~* /(wp-admin|wp-content|wp-includes|xmlrpc\.php|phpmyadmin|pma|adminer|\.env|\.git) {
        access_log off;
        log_not_found off;
        return 404;
    }

    # 5. Default Static Route Handling
    location / {
        try_files $uri $uri/ /404.html;
    }

    # Custom 404 page with zero scripts
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
